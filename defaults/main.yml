---
# @meta author:value: [Xenion1987](https://github.com/Xenion1987)
# @meta description: >
# Install the latest `fastfetch` version from GitHub.
# Fall back to `fastfetch` version 2.7.1 if the target's
# latest version is 'glib<2.35'.
# @end

# @var fastfetch_dependencies:description: List of dependencies for fastfetch
# @var fastfetch_dependencies:type: dict
# @var fastfetch_dependencies:required: true
# @var fastfetch_dependencies:default: {"deb_based": ["libc6"], "rpm_based": ["glibc"]}
fastfetch_dependencies:
  deb_based:
    - libc6
  rpm_based:
    - glibc

# @var fastfetch_fallback_version:description: Fallback fastfetch version if glib < fastfetch_glib_requirement_latest
# @var fastfetch_fallback_version:type: string
# @var fastfetch_fallback_version:required: true
# @var fastfetch_fallback_version:default: "2.7.1"
fastfetch_fallback_version: "2.7.1"

# @var fastfetch_github_orga:description: fastfetch's GitHub organisation name
# @var fastfetch_github_orga:type: string
# @var fastfetch_github_orga:required: true
# @var fastfetch_github_orga:default: "fastfetch-cli"
fastfetch_github_orga: fastfetch-cli

# @var fastfetch_github_repo:description: fastfetch's GitHub repository name
# @var fastfetch_github_repo:type: string
# @var fastfetch_github_repo:required: true
# @var fastfetch_github_repo:default: "fastfetch"
fastfetch_github_repo: fastfetch

# @var fastfetch_glib_requirement_latest:description: Minimum glib version required for installing latest fastfetch version
# @var fastfetch_glib_requirement_latest:type: string
# @var fastfetch_glib_requirement_latest:required: true
# @var fastfetch_glib_requirement_latest:default: "2.35"
fastfetch_glib_requirement_latest: "2.35"

# @var fastfetch_force_fail:description: Whether to fail hard if fastfetch cannot be installed, or only warn
# @var fastfetch_force_fail:type: bool
# @var fastfetch_force_fail:required: false
# @var fastfetch_force_fail:default: true
fastfetch_force_fail: true
