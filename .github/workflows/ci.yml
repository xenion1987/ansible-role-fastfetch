---
name: CI Pipeline

on:
  pull_request:
  push:
    branches:
      - main

defaults:
  run:
    working-directory: "ansible-role-fastfetch"

env:
  PY_COLORS: "1"
  ANSIBLE_FORCE_COLOR: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          path: "ansible-role-fastfetch"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v8

      - name: Install dependencies
        run: uv sync --dev

      - name: Run yamllint
        run: uv run yamllint .

      - name: Run ansible-lint
        run: uv run ansible-lint

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        distro:
          - "debian13"
          - "rockylinux9"
          - "ubuntu2404"
        ansible-version:
          - "2.20"
        python-version:
          - "3.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          path: "ansible-role-fastfetch"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8

      - name: Install dependencies
        run: uv sync --dev

      - name: Run molecule test
        run: uv run molecule test
        env:
          MOLECULE_DISTRO: ${{ matrix.distro }}
