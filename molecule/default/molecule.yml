---
dependency:
  name: galaxy
driver:
  name: podman
platforms:
  - &platform_defaults
    name: debian13
    image: "docker.io/geerlingguy/docker-${MOLECULE_DISTRO:-debian13}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    tmpfs:
      /run: "rw"
      /tmp: "rw"
  - <<: *platform_defaults
    name: rockylinux9
    image: "docker.io/geerlingguy/docker-${MOLECULE_DISTRO:-rockylinux9}-ansible:latest"
  - <<: *platform_defaults
    name: ubuntu2404
    image: "docker.io/geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2404}-ansible:latest"

# Required for 'offline' role testing
provisioner:
  name: ansible
  env:
    # ANSIBLE_ROLES_PATH: "../../../"
    ANSIBLE_DEPRECATION_WARNINGS: false
verifier:
  name: ansible
