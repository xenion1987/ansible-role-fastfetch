---
- name: Check if fastfetch is already installed
  changed_when: false
  ignore_errors: true
  register: tmp_out
  ansible.builtin.command:
    cmd: command -v fastfetch
# - name: DEBUG | VAR | tmp_out
#   when: debug | d(false)
#   ansible.builtin.debug:
#     var: tmp_out
# - name: DEBUG | VAR | fastfetch_force_update
#   when: debug | d(false)
#   ansible.builtin.debug:
#     var: fastfetch_force_update

- name: BLOCK | Install/Update fastfetch
  when: (fastfetch_force_update) or (tmp_out.rc > 0)
  block:
    - name: Get fastfetch latest version number
      become: false
      delegate_to: localhost
      register: curl_output
      run_once: true
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ fastfetch_github_orga }}/{{ fastfetch_github_repo }}/releases/latest"
        body_format: json
    # - name: DEBUG | VAR | curl_output
    #   when: debug | d(false)
    #   ansible.builtin.debug:
    #     var: curl_output
    - name: Inlcude install tasks based on {{ ansible_distribution_file_variety }}
      ansible.builtin.include_tasks:
        file: install-{{ ansible_distribution_file_variety | lower }}-based.yml
